[Config]
MinimumVersion=24

[Distribution]
Distribution=rosa
Release=rosa14
Architecture=riscv64
RepositoryKeyCheck=no
Mirror=https://abf-d.rosa.ru/


[Output]
#Format=directory
Format=disk
CompressOutput=
# nand u-boot does not support
# 4k sectors
SectorSize=512

[Content]
Packages=
    coreutils
    dnf5
    sudo
    dracut
    pciutils
    usbutils
    iproute2
    iw
    iwd
    dosfstools
    neovim
    kernel-7.2-generic
    armbian-firmware
    locales-en
    openssh-server
    ncurses-extraterms
    passwd
    systemd-boot
    rosa-repos
    rosa-repos-contrib
    systemd
    uboot-tools

Bootable=no
Bootloader=none
Autologin=yes
RootPassword=root
RootShell=/usr/bin/bash
Locale=en_US.UTF-8
Timezone=Europe/Moscow
Hostname=rv2board
WithDocs=no
CleanPackageMetadata=false
WithRecommends=no

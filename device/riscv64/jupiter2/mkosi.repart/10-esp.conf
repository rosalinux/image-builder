# ESP is the /boot partition (as in napi2): vmlinuz, initrd, dtb,
# loader entries and the systemd-boot binary land here via
# mkosi.postinst.chroot; no mkosi Bootable=/UKI machinery.
# The partition starts at 12M, right after the 11M firmware gap
# (00-firmware-gap.conf); firmware offsets mirror the K3-Ubuntu-Images
# partition_universal.json layout.
[Partition]
Type=esp
Format=vfat
Label=ESP
SizeMinBytes=512M
SizeMaxBytes=512M
MountPoint=/boot
CopyFiles=/boot:/
